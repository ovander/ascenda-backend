name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race detector)
        run: go test -short -race -count=1 -coverprofile=coverage.out ./...

      # Total coverage must not fall below the floor in script/coverage-floor.sh.
      - name: Coverage floor
        run: bash script/coverage-floor.sh coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so --new-from-rev can diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pull requests are gated on issues they introduce; the pre-existing
      # backlog (see docs/AUDIT-2026-09-25.md §6) is reported on main pushes
      # without failing the build until it has been worked down.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0  # built with Go 1.27; older builds refuse a Go 1.27 module
          only-new-issues: ${{ github.event_name == 'pull_request' }}
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # The whole tree is gofmt-clean since the tree-wide reformat; any file
      # that drifts fails the build, on pull requests and on main alike.
      - name: gofmt (whole tree)
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: the following files are not formatted (run: gofmt -w .):"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          echo "tree is gofmt-clean"

  integration:
    name: Database integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Tests behind the `integration` build tag (internal/repo, and the
      # snapshot restore tests in internal/service) spin up PostgreSQL 16
      # through testcontainers-go (internal/testdb); ubuntu-latest ships Docker.
      - name: Integration tests
        run: go test -tags integration -count=1 ./internal/repo/... ./internal/service/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

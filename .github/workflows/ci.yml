name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race detector)
        run: go test -short -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so --new-from-rev can diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pull requests are gated on issues they introduce; the pre-existing
      # backlog (see docs/AUDIT-2026-09-25.md §6) is reported on main pushes
      # without failing the build until it has been worked down.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          only-new-issues: ${{ github.event_name == 'pull_request' }}
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Formatting is enforced on the files a pull request touches. The rest of
      # the tree still carries historical drift; once a tree-wide `gofmt -w .`
      # has landed, replace this step with `test -z "$(gofmt -l .)"`.
      - name: gofmt on changed files
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD -- '*.go' | grep -v '^vendor/' || true)
          if [ -z "$files" ]; then echo "no Go files changed"; exit 0; fi
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: the following changed files are not formatted:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          echo "all changed Go files are gofmt-clean"

      - name: gofmt (whole tree, informational)
        if: github.event_name != 'pull_request'
        run: |
          count=$(gofmt -l . | wc -l | tr -d ' ')
          echo "unformatted files in tree: $count"

  integration:
    name: Repository integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # internal/repo tests are behind the `integration` build tag and spin up
      # PostgreSQL 16 through testcontainers-go; ubuntu-latest ships Docker.
      - name: Integration tests
        run: go test -tags integration -count=1 ./internal/repo/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

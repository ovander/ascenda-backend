name: Bug report
description: Something in Ascenda does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security vulnerability, do **not** open an issue: use the
        Security tab → Report a vulnerability.
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: User menu → About Ascenda → Copy, and paste here (application and server versions).
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open plan … → scenario … → Products
        2. …
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 153 on macOS, Safari on iPhone…
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors, request IDs
      description: The X-Request-Id of a failing API call (browser developer tools → Network) helps find it in the server logs. Remove any personal or financial data.
